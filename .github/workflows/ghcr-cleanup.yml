name: ghcr-cleanup

# Dọn phiên bản image cũ trên GHCR: kho private chỉ có 500 MB miễn phí, mỗi lần merge lại thêm image mới.
# Giữ develop, main, tag phát hành, 5 bản mới nhất và các manifest con của chúng (.github/scripts/ghcr-cleanup.py).
# Lịch hằng tuần chỉ chạy trên nhánh mặc định (main) và chỉ xoá thật khi biến repo GHCR_CLEANUP_ENABLED=true;
# chưa bật thì chỉ in danh sách sẽ xoá. Bản đã xoá khôi phục được trong 30 ngày ở Package settings.
on:
  schedule:
    # 09:17 sáng thứ Hai giờ Việt Nam.
    - cron: "17 2 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Chỉ liệt kê, không xoá
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/ghcr-cleanup.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGES: "tripflix-fe/web tripflix-fe/admin"
          KEEP_RECENT: "5"
          # Chạy tay: theo ô dry_run. Theo lịch: chỉ xoá khi GHCR_CLEANUP_ENABLED=true.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && 'true' || 'false') || (vars.GHCR_CLEANUP_ENABLED == 'true' && 'false' || 'true') }}
