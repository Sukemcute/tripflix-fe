name: publish

on:
  push:
    branches: [develop, main]
    tags: ["v*", "web-v*", "admin-v*", "mobile-v*"]

permissions:
  contents: read
  packages: write

env:
  # Next gắn địa chỉ này vào bundle lúc build. Hiện chỉ có một server là staging.
  STAGING_API_URL: https://api.tripflix.io.vn

jobs:
  # Tag mobile-v* chỉ build APK, không chạy lại CI và không build image web, admin.
  check:
    if: ${{ !startsWith(github.ref, 'refs/tags/mobile-v') }}
    uses: ./.github/workflows/ci.yml

  web:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Builder buildx cần cho cache type=gha (driver docker mặc định không ghi được cache này).
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: prod
          push: true
          # Mỗi dòng một biến; dòng trống (bản admin) bị bỏ qua. GOOGLE_CLIENT_ID là biến (Variables) của repo,
          # không phải secret: Client ID công khai. Chưa đặt thì web không hiện nút Google.
          build-args: |
            ${{ matrix.app == 'web' && format('NEXT_PUBLIC_API_URL={0}', env.STAGING_API_URL) || '' }}
            ${{ matrix.app == 'web' && format('NEXT_PUBLIC_GOOGLE_CLIENT_ID={0}', vars.GOOGLE_CLIENT_ID) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Mỗi app một scope cache, để web và admin không ghi đè cache của nhau.
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy-web:
    needs: web
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/deploy-web.yml
    with:
      commit: ${{ github.sha }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

  mobile:
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tripflix/mobile build:apk --non-interactive
