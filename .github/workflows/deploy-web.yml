name: deploy-web

on:
  workflow_call:
    inputs:
      app:
        description: web hoặc admin
        required: false
        default: web
        type: string
      commit:
        description: Commit đã có image trên GHCR
        required: true
        type: string
    secrets:
      DEPLOY_SSH_KEY:
        required: true
  workflow_dispatch:
    inputs:
      app:
        description: App cần deploy
        required: true
        default: web
        type: choice
        options: [web, admin]
      commit:
        description: Commit đã có image trên GHCR, ít nhất 7 ký tự đầu
        required: true
        type: string

permissions:
  contents: read

env:
  DEPLOY_HOST: 34.126.176.227
  # Host key công khai của server, để CI không kết nối nhầm máy khác.
  DEPLOY_KNOWN_HOST: 34.126.176.227 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICrqTafEyy1D1a7Q5VhvXSOwOiwbFsyY0WEyNpv+lzOZ

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Không chạy chồng hai lần deploy trên một server.
    concurrency:
      group: deploy-web-staging
      cancel-in-progress: false
    steps:
      - name: Chạy script deploy trên server
        env:
          APP: ${{ inputs.app }}
          COMMIT: ${{ inputs.commit }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{7,40}$ ]] || { echo "Commit không hợp lệ" >&2; exit 2; }
          # Script trên server hiểu "sha-xxxxxxx" (web) và "admin sha-xxxxxxx".
          case "$APP" in
            web) command="sha-${COMMIT:0:7}" ;;
            admin) command="admin sha-${COMMIT:0:7}" ;;
            *) echo "App không hợp lệ" >&2; exit 2 ;;
          esac
          umask 077
          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOST" > "$known_hosts_file"
          ssh -i "$key_file" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            -o ConnectTimeout=20 \
            "deploy@$DEPLOY_HOST" "$command"
